# Logrotate config for edu backend
# Install: cp deploy/logrotate-edu.conf /etc/logrotate.d/edu
# Test:    logrotate -d /etc/logrotate.d/edu
#
# 策略:
# - 每天 rotate 一次
# - 保留 14 天历史
# - 压缩旧文件 (省磁盘)
# - copytruncate: 不需要重启 gunicorn (它持有 fd 的话会继续写空文件)
# - 小于 100K 跳过, 避免空文件也被 rotate

/var/log/edu/*.log /var/log/edu/*.err {
    daily
    rotate 14
    compress
    delaycompress
    missingok
    notifempty
    minsize 100k
    copytruncate
    dateext
    dateformat -%Y%m%d
}
