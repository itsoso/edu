# edu 学习系统 - Nginx 配置 (示例)
# 部署时请将 YOUR_DOMAIN 替换为你的实际域名
# 后端: 127.0.0.1:5060 (Flask + gunicorn)
# 前端: 静态文件 /opt/edu/frontend/dist

# HTTP 重定向到 HTTPS (首次部署尚未签证书时, 注释 return 并临时回源到前端)
server {
    listen 80;
    server_name YOUR_DOMAIN;

    location /.well-known/acme-challenge/ {
        root /var/www/executor.life;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS 主配置
server {
    listen 443 ssl http2;
    server_name YOUR_DOMAIN;

    ssl_certificate     /etc/letsencrypt/live/YOUR_DOMAIN/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/YOUR_DOMAIN/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    client_max_body_size 8M;

    # Journal 多媒体上传 (音频/视频) — 单独设 25M 限制
    location /api/journal/media {
        client_max_body_size 25M;
        proxy_pass http://127.0.0.1:5060/api/journal/media;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 30s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;
    }

    # API 代理到 Flask 后端
    location /api/ {
        proxy_pass http://127.0.0.1:5060/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 30s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # React SPA 构建产物
    location /assets/ {
        alias /opt/edu/frontend/dist/assets/;
        expires 1y;
        access_log off;
        add_header Cache-Control "public, immutable";
    }

    # SPA 路由 fallback
    location / {
        root /opt/edu/frontend/dist;
        try_files $uri $uri/ /index.html;
    }

    # 压缩
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;
}
