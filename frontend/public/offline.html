<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>学习系统 | 离线中</title>
    <style>
      :root {
        color-scheme: light;
        font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", sans-serif;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: linear-gradient(180deg, #eff6ff, #f8fafc);
        color: #0f172a;
        padding: 24px;
      }

      .card {
        width: min(420px, 100%);
        background: rgba(255, 255, 255, 0.92);
        border: 1px solid #dbeafe;
        border-radius: 24px;
        box-shadow: 0 20px 60px rgba(15, 23, 42, 0.08);
        padding: 28px;
      }

      h1 {
        margin: 0 0 12px;
        font-size: 24px;
      }

      p {
        margin: 0;
        line-height: 1.7;
        color: #475569;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <h1>网络暂时断开了</h1>
      <p>学习系统的大部分功能仍然需要连接后端 AI 和数据服务。请检查网络后重新打开，或稍后再试。</p>
    </div>
  </body>
</html>
